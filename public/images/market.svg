<text x="48" y="88" fill="#e8ecff" font-size="30" font-weight="700">Market-intelligence system</text>
<text x="48" y="118" fill="#8b96bb" font-size="16">Multi-agent system that reads the market in English and Arabic and proposes leads to a human.</text>
<rect x="48" y="150" width="200" height="62" rx="26" fill="#10172e" stroke="#243056" stroke-width="1.2"/><text x="148" y="177" text-anchor="middle" fill="#e8ecff" font-size="15" font-weight="600">Sources</text><text x="148" y="197" text-anchor="middle" fill="#8b96bb" font-size="12">allow-listed, EN / AR</text><path d="M251,181 L269,181" stroke="#8b96bb" stroke-width="1.6" marker-end="url(#ar)"/><rect x="274" y="150" width="200" height="62" rx="26" fill="#10172e" stroke="#243056" stroke-width="1.2"/><text x="374" y="177" text-anchor="middle" fill="#e8ecff" font-size="15" font-weight="600">Ingest</text><text x="374" y="197" text-anchor="middle" fill="#8b96bb" font-size="12">fetch · clean · store</text><path d="M477,181 L495,181" stroke="#8b96bb" stroke-width="1.6" marker-end="url(#ar)"/><rect x="500" y="150" width="200" height="62" rx="26" fill="#171d3f" stroke="#9b6bff" stroke-width="2"/><text x="600" y="177" text-anchor="middle" fill="#e8ecff" font-size="15" font-weight="600">Classify + extract</text><text x="600" y="197" text-anchor="middle" fill="#9b6bff" font-size="12">schema-enforced LLM</text><path d="M703,181 L721,181" stroke="#8b96bb" stroke-width="1.6" marker-end="url(#ar)"/><rect x="726" y="150" width="200" height="62" rx="26" fill="#171d3f" stroke="#9b6bff" stroke-width="2"/><text x="826" y="177" text-anchor="middle" fill="#e8ecff" font-size="15" font-weight="600">Knowledge graph</text><text x="826" y="197" text-anchor="middle" fill="#9b6bff" font-size="12">one company, one node</text><path d="M929,181 L947,181" stroke="#8b96bb" stroke-width="1.6" marker-end="url(#ar)"/><rect x="952" y="150" width="200" height="62" rx="26" fill="#0f2a24" stroke="#34d399" stroke-width="2"/><text x="1052" y="177" text-anchor="middle" fill="#e8ecff" font-size="15" font-weight="600">Human review</text><text x="1052" y="197" text-anchor="middle" fill="#34d399" font-size="12">before any CRM write</text>
